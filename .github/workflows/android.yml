name: Android build and checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build unsigned release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6, Node 24
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7, Node 24
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream.lock.json

      - name: Install pinned Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # sdkmanager is the pipeline status; yes may exit on the closed pipe.
          (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null)
          "$sdkmanager" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Prepare verified Node runtime and complete SillyTavern bundle
        run: |
          python3 scripts/prepare_runtime.py
          node scripts/prepare_bundle.mjs
          cp app/libnode/LICENSE app/src/main/assets/Node-LICENSE.txt
          cp LICENSE app/src/main/assets/SillyTavern-LICENSE.txt

      - name: Test compatibility, archives and actual bundled backend workflows
        run: |
          npm test
          ./scripts/test_archive.sh
          ./scripts/test_runtime_storage.sh
          ./scripts/test_backup.sh
          ./scripts/test_android_interaction.sh --build-only
          npm run test:integration
          npm run test:features

      - name: Build unsigned release and run Android Lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease --console=plain

      - name: Collect unsigned APKs, source and provenance
        run: |
          mkdir -p .cache/ci-artifacts
          cp app/build/outputs/apk/release/*-unsigned.apk .cache/ci-artifacts/
          python3 scripts/package_source.py
          cp dist/*-source.tar.gz .cache/ci-artifacts/
          cp app/libnode/runtime.json .cache/ci-artifacts/node-runtime.json
          cp app/src/main/assets/bundle-manifest.json .cache/ci-artifacts/
          cp upstream.lock.json .cache/ci-artifacts/
          (
            cd .cache/ci-artifacts
            sha256sum -- *.apk *.tar.gz *.json > SHA256SUMS.txt
          )

      - name: Upload build artifacts (unsigned, not installable)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: android-release-unsigned-${{ github.sha }}
          path: .cache/ci-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: android-check-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-release.*
            .cache/smoke-server.log
          if-no-files-found: ignore
          retention-days: 14
