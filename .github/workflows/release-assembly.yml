name: Stage frozen alpha.3 release assets

on:
  push:
    branches: [codex/release-assembly]

permissions:
  contents: read

concurrency:
  group: frozen-alpha3-release-assembly
  cancel-in-progress: false

jobs:
  stage-assets:
    if: github.repository == 'Ceaserk01/LocalTavern-Android' && github.actor == 'Ceaserk01' && github.ref == 'refs/heads/codex/release-assembly'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out reviewed assembly helper and frozen public payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify local payload without credentials or network
        run: python3 scripts/release_assembly.py --verify-payload

      - name: Stage only absent exact files in the existing draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The live browser ARM upload may be absent from the asset list.
          # Change only after the owner confirms that browser transfer is terminal.
          ARM_MODE: defer
        run: python3 scripts/release_assembly.py --publish

      - name: Retain bounded staging report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frozen-alpha3-staging-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/release-assembly/report.json
          if-no-files-found: ignore
          retention-days: 14
